name: Resume Metrics Maven Diagnostic V2

on:
  push:
    branches:
      - resume-metrics-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Capture Maven test/build diagnostics
        shell: bash
        run: |
          set +e
          mvn -B test > mvn-test.log 2>&1
          TEST_CODE=$?
          mvn -B -DskipTests package > mvn-build.log 2>&1
          BUILD_CODE=$?
          set -e
          printf 'testExit=%s\nbuildExit=%s\n' "$TEST_CODE" "$BUILD_CODE" > diagnostic.txt
          echo '=== TEST TAIL ==='
          tail -n 120 mvn-test.log || true
          echo '=== BUILD TAIL ==='
          tail -n 120 mvn-build.log || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostic-v2
          path: |
            diagnostic.txt
            mvn-test.log
            mvn-build.log
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
